<!DOCTYPE html>
<html lang="fr" class="dark scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>El Fuego & Exoti’K — Restaurant, Bar & Fruits Frais à Cotonou</title>
  <meta name="description" content="Restaurant, pizzeria, bar à cocktails et comptoir de fruits frais d'exception à Akpakpa, Cotonou. Grillades au feu de bois, pizzas, coupes de fruits et réservations en ligne avec Pass VIP.">
  <meta name="theme-color" content="#e8480c">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Masquage radical et immédiat des widgets et bannières injectés par Netlify -->
  <style>
    netlify-drawer,
    #netlify-drawer,
    [data-netlify-drawer],
    [class*="netlify-drawer"],
    [id*="netlify-drawer"],
    [data-netlify-badge],
    iframe[src*="netlify"],
    iframe[title*="Netlify"],
    iframe[id*="netlify"],
    div:has(> iframe[src*="netlify"]),
    div:has(> iframe[title*="Netlify"]) {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      height: 0 !important;
      width: 0 !important;
      position: absolute !important;
      z-index: -9999 !important;
    }
  </style>
  <script>
    (function() {
      function purgeNetlifyElements() {
        const selectors = [
          'netlify-drawer',
          '#netlify-drawer',
          '[data-netlify-drawer]',
          '[data-netlify-badge]',
          'iframe[src*="netlify"]',
          'iframe[title*="Netlify"]',
          'iframe[id*="netlify"]'
        ];
        selectors.forEach(function(sel) {
          document.querySelectorAll(sel).forEach(function(el) {
            try { el.remove(); } catch (err) { el.style.display = 'none'; }
          });
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', purgeNetlifyElements);
      } else {
        purgeNetlifyElements();
      }
      var observer = new MutationObserver(purgeNetlifyElements);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      setTimeout(function() { observer.disconnect(); }, 12000);
    })();
  </script>
</head>
<body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
